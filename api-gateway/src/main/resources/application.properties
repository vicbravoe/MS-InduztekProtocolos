spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.discovery.locator.enabled=false

spring.cloud.gateway.routes[0].id=usuarios-service
spring.cloud.gateway.routes[0].uri=lb://usuarios-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/usuarios/**

spring.cloud.gateway.routes[1].id=catalogo-service
spring.cloud.gateway.routes[1].uri=lb://catalogo-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/instalaciones/**,/api/equipos/**,/api/instrumentos/**

spring.cloud.gateway.routes[2].id=protocolos-service
spring.cloud.gateway.routes[2].uri=lb://protocolos-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/visitas/**,/api/protocolos/**,/api/pruebas/**
